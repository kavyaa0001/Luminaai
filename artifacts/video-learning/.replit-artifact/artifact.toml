kind = "web"
previewPath = "/"
title = "AI Video Learning Analyzer"
version = "1.0.0"
id = "artifacts/video-learning"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22019

[services.development]
run = "pnpm --filter @workspace/video-learning run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/video-learning", "run", "build" ]
publicDir = "artifacts/video-learning/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22019"
BASE_PATH = "/"
